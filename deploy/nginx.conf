# Real IP from Cloudflare proxy — use CF-Connecting-IP header instead of $remote_addr
# so rate limiting targets the actual user IP, not Cloudflare's edge IP.
set_real_ip_from 0.0.0.0/0;
real_ip_header CF-Connecting-IP;

# Rate limit zone: 30 requests/minute per real IP, 10MB state store (~160k IPs)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
limit_req_status 429;

server {
    listen 80;
    server_name api.universalevidence.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.universalevidence.com;

    ssl_certificate     /etc/letsencrypt/live/api.universalevidence.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.universalevidence.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        limit_req          zone=api_limit burst=10 nodelay;
        proxy_pass         http://127.0.0.1:8000/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
    }
}

server {
    listen 80;
    server_name universalevidence.com www.universalevidence.com;

    # Let's Encrypt ACME challenge (certbot uses this before cert is issued)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name universalevidence.com www.universalevidence.com;

    # TLS — managed by certbot (run: certbot --nginx -d universalevidence.com -d www.universalevidence.com)
    ssl_certificate     /etc/letsencrypt/live/universalevidence.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/universalevidence.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # React frontend — static build output
    root /var/www/universalevidence;
    index index.html;

    # API proxy
    location /api/ {
        proxy_pass         http://127.0.0.1:8000/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Dereferenceable concept URIs — proxy straight to the API
    # backend at the same path, no /api/ prefix stripped, since concept URIs
    # live at /vocab/{vocabulary}/{term} and /ontology on the backend itself.
    # Without this, these paths fell through to the SPA fallback below.
    location /vocab/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # /ontology is whole-file only on the backend (no /ontology/{term} route,
    # returns 404 by design) — proxy the prefix broadly anyway, harmless.
    location /ontology {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Discovery endpoints must never fall through to the SPA.
    location = /robots.txt {
        types { }
        default_type text/plain;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /sitemap.xml {
        types { }
        default_type application/xml;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA fallback — all unknown paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
