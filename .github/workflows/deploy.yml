name: Deploy (operator invocation required)

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  operator-instructions:
    runs-on: ubuntu-latest
    steps:
      - name: Production activation is disabled in Actions
        run: |
          echo 'No production credentials or SSH activation are used by this workflow.'
          echo 'Follow deploy/RELEASE_BUILD.md and invoke deploy/release.py with a private validated plan on the release host.'
          echo 'The obsolete git-pull/build/copy/prune path has been removed.'
          exit 1
